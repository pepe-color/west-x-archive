<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEST. X資料館 Ver.0.01 | ペペランド</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#1c2941;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#153b83,#668de2);color:white;padding:34px 20px}header>div,main{max-width:1050px;margin:auto}h1{margin:0 0 8px;font-size:clamp(1.5rem,4vw,2.2rem)}header p{margin:0;opacity:.9}main{padding:22px 16px 60px}.controls{background:white;padding:16px;border-radius:14px;display:flex;flex-wrap:wrap;align-items:end;gap:12px;box-shadow:0 2px 12px #243b5e12}.field{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:700}select,input,button{font:inherit;border:1px solid #c9d2e2;border-radius:9px;padding:9px 12px;background:white;color:#1c2941}button{cursor:pointer;background:#184a9c;color:white;border:0}button:hover{background:#123977}.meta{margin:22px 0 12px;color:#506078}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px;align-items:start}.post{background:white;border-radius:13px;padding:16px;box-shadow:0 2px 12px #243b5e12;min-width:0}.post h2{font-size:.9rem;margin:0 0 8px}.post a{color:#2054a6;overflow-wrap:anywhere}.embed{min-height:65px}.fallback{font-size:.9rem;color:#65758a}.pager{display:flex;justify-content:center;align-items:center;gap:14px;margin:24px 0}.note{font-size:.85rem;color:#5d6c7d;line-height:1.7} .empty{padding:30px;background:white;border-radius:12px}
</style></head><body><header><div><h1>📚 WEST. X資料館</h1><p>ペペランド ｜ Ver.0.01 · 画像付き投稿のリンクを集めた試作館</p></div></header>
<main><div class="controls"><label class="field">投稿年<select id="year"><option value="">すべての年</option></select></label><label class="field">並び順<select id="sort"><option value="new">新しい順</option><option value="old">古い順</option></select></label><label class="field">内容タグ<select id="tag"><option value="">すべてのタグ</option></select></label><button id="reset" type="button">条件をリセット</button></div>
<p class="meta" id="count" aria-live="polite">読み込み中…</p><div id="posts" class="grid"></div><div class="pager"><button id="prev" type="button">前へ</button><span id="page"></span><button id="next" type="button">次へ</button></div>
<p class="note">投稿本文は当サイトに転載せず、X公式の埋め込みで表示しています。埋め込みが表示されない場合は「Xで投稿を見る」から開いてください。投稿の削除・非公開設定や閲覧環境によっては表示できません。投稿日時は収集リストの日付を使用しています。</p></main>
<script>
'use strict';let all=[],filtered=[],page=0;const perPage=8,$=id=>document.getElementById(id);const dateText=s=>s?s.replace(/-/g,'/'):'日付未登録';
function setup(){const years=[...new Set(all.map(p=>p.date.slice(0,4)).filter(Boolean))].sort().reverse();for(const y of years){const o=document.createElement('option');o.value=y;o.textContent=y+'年';$('year').append(o)}const tags=[...new Set(all.flatMap(p=>p.tags||[]))].sort((a,b)=>a.localeCompare(b,'ja'));for(const t of tags){const o=document.createElement('option');o.value=t;o.textContent=t;$('tag').append(o)}}
function apply(){const y=$('year').value,t=$('tag').value;filtered=all.filter(p=>(!y||p.date.startsWith(y))&&(!t||(p.tags||[]).includes(t))).sort((a,b)=>$('sort').value==='new'?b.date.localeCompare(a.date):a.date.localeCompare(b.date));page=0;render()}
function render(){const pages=Math.ceil(filtered.length/perPage);page=Math.max(0,Math.min(page,Math.max(0,pages-1)));$('count').textContent=`${filtered.length}件の投稿`;const host=$('posts');host.replaceChildren();for(const p of filtered.slice(page*perPage,(page+1)*perPage)){const card=document.createElement('article');card.className='post';const heading=document.createElement('h2');heading.textContent='📅 '+dateText(p.date);card.append(heading);const holder=document.createElement('div');holder.className='embed';card.append(holder);const link=document.createElement('a');link.href=p.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Xで投稿を見る ↗';card.append(link);host.append(card);if(window.twttr?.widgets?.createTweet){window.twttr.widgets.createTweet(p.id,holder,{conversation:'none',dnt:true}).then(el=>{if(!el){holder.textContent='埋め込みを表示できませんでした。'}}).catch(()=>{holder.textContent='埋め込みを表示できませんでした。'})}else{holder.innerHTML='<p class="fallback">埋め込みを読み込み中…（表示できない場合は下のリンクへ）</p>'}}$('page').textContent=pages?`${page+1} / ${pages} ページ`:'0 / 0 ページ';$('prev').disabled=page===0;$('next').disabled=page>=pages-1}
$('year').addEventListener('change',apply);$('tag').addEventListener('change',apply);$('sort').addEventListener('change',apply);$('reset').addEventListener('click',()=>{$('year').value='';$('tag').value='';$('sort').value='new';apply()});$('prev').addEventListener('click',()=>{page--;render();scrollTo({top:0,behavior:'smooth'})});$('next').addEventListener('click',()=>{page++;render();scrollTo({top:0,behavior:'smooth'})});
fetch('./x_posts.json').then(r=>{if(!r.ok)throw Error('データを読み込めませんでした');return r.json()}).then(data=>{all=data;setup();apply();window.allPostsReady=true}).catch(e=>{$('count').textContent=e.message+'。GitHub Pagesで開くか、x_posts.jsonの配置を確認してください。'});
</script><script async src="https://platform.twitter.com/widgets.js" charset="utf-8" onload="if(window.twttr?.widgets?.load)window.twttr.widgets.load(); if(window.allPostsReady)render()"></script>
</body></html>
